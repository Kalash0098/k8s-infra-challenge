apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visit-counter
  template:
    metadata:
      labels:
        app: visit-counter
    spec:
      containers:
      - name: app
        image: kalash655/visit-counter:v1
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_HOST
          value: "redis"
        readinessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  type: NodePort
  selector:
    app: visit-counter
  ports:
    - port: 5000
      targetPort: 5000
      